<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Matches</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6600">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        
        /* TOP BAR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .top-bar-side { width: 85px; display: flex; align-items: center; }
        .top-bar-side.left { justify-content: flex-start; }
        .top-bar-side.right { justify-content: flex-end; }
        h1 { color: #FF6600; margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 2.5rem; text-align: center; flex: 1; }
        .btn-back { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; display: none; font-weight: bold; }
        .admin-link { text-decoration: none; font-size: 1.5rem; filter: grayscale(1); opacity: 0.6; transition: 0.3s; }
        .admin-link:hover { opacity: 1; filter: none; }

        /* MENU STYLING */
        #menu-container { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-top: 40px; }
        .tournament-card { background: #1E1E1E; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #333; cursor: pointer; transition: 0.3s; font-size: 1.5rem; font-weight: bold; }
        .tournament-card:hover { border-color: #FF6600; background: #252525; }

        /* FILTER STYLING */
        #filter-container { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { background: #222; color: #888; border: 1px solid #444; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.2s; }
        .filter-btn:hover { background: #333; color: white; }
        .filter-btn.active { background: #FF6600; color: white; border-color: #FF6600; }

        /* MATCH STYLING */
        #matches-container { display: grid; gap: 15px; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); display: none; }
        .match-card { background: #1E1E1E; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; border-left: 5px solid #FF6600; }
        .card-header { background: linear-gradient(90deg, #FF6600 0%, #E65C00 100%); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .board-badge { background: black; color: white; padding: 5px 10px; border-radius: 5px; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.2); }
        .card-subheader { background: #333; padding: 5px 15px; font-size: 0.85rem; color: #ccc; display: flex; justify-content: space-between; align-items: center; }
        .match-id { background: #555; padding: 2px 6px; border-radius: 3px; font-family: monospace; color: white; }
        .players-area { padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; flex-grow: 1; }
        .player-name { flex: 1; text-align: center; word-wrap: break-word; }
        .score-box { background: #111; padding: 10px 15px; margin: 0 15px; border-radius: 6px; font-size: 1.8rem; font-weight: bold; color: #FF6600; border: 2px solid #333; min-width: 60px; text-align: center; }
        
        .recap-btn { background: #FF6600; color: white; text-decoration: none; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-left: 10px; font-size: 0.8rem; border: 1px solid #e65c00; }
        .recap-btn:hover { background: #e65c00; }

        .match-card.mogelijk { border-left-color: #666; opacity: 0.7; filter: grayscale(80%); }
        .match-card.mogelijk .card-header { background: #444; color: #bbb; }
        .match-card.gespeeld { border-left-width: 10px; opacity: 0.8; }
        .match-card.win { border-left-color: #2ecc71; }
        .match-card.verlies { border-left-color: #e74c3c; }
        .match-card.gespeeld .card-header { background: #222; color: #888; }
        .match-card.gespeeld .score-box { color: #fff; border-color: #444; }

        .section-title { grid-column: 1 / -1; color: #888; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 20px; text-transform: uppercase; font-size: 0.9rem; }
        .no-matches { text-align: center; color: #888; margin-top: 50px; grid-column: 1 / -1; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.4rem; }
            .btn-back { padding: 8px 10px; font-size: 0.8rem; }
            #filter-container { gap: 5px; }
            .filter-btn { padding: 5px 10px; font-size: 0.8rem; }
            #matches-container { grid-template-columns: 1fr; gap: 8px; }
            .card-header { padding: 5px 10px; font-size: 0.85rem; }
            .board-badge { font-size: 0.85rem; padding: 2px 6px; }
            .card-subheader { padding: 3px 10px; font-size: 0.75rem; }
            .players-area { padding: 8px 5px; font-size: 0.95rem; }
            .score-box { padding: 5px 8px; margin: 0 8px; font-size: 1.2rem; min-width: 45px; border-width: 1px; }
            .section-title { margin-top: 15px; font-size: 0.8rem; }
            .match-card.gespeeld { border-left-width: 5px; }
        }

        /* PUSH MODAL */
        #push-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .push-box { background: #1E1E1E; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #FF6600; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .push-box h2 { color: #FF6600; margin-top: 0; font-size: 2rem; }
        .push-box p { color: #ccc; font-size: 1.1rem; margin-bottom: 25px; }
        .push-box button.btn-yes { background: #2ecc71; color: white; border: none; padding: 15px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.2rem; margin-bottom: 15px; }
        .push-box button.btn-no { background: transparent; color: #888; border: none; text-decoration: underline; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-side left">
            <button class="btn-back" id="btn-back" onclick="showMenu()">⬅ TERUG</button>
        </div>
        <h1 id="main-title">🎯 TOERNOOIEN</h1>
        <div class="top-bar-side right">
            <a href="/admin.html" class="admin-link">⚙️</a>
        </div>
    </div>

    <div id="filter-container">
        <button class="filter-btn active" onclick="setFilter('alles')" id="filter-alles">Alles</button>
        <button class="filter-btn" onclick="setFilter('gepland')" id="filter-gepland">⚡ Gepland</button>
        <button class="filter-btn" onclick="setFilter('mogelijk')" id="filter-mogelijk">🔮 Mogelijk</button>
        <button class="filter-btn" onclick="setFilter('gespeeld')" id="filter-gespeeld">✅ Gespeeld</button>
    </div>
    
    <div id="menu-container">Laden...</div>
    <div id="matches-container"></div>

    <div id="push-modal">
        <div class="push-box">
            <h2>🔔 Mis Niets!</h2>
            <p>Zet je meldingen aan zodat we je direct kunnen waarschuwen als je moet gooien of schrijven op het toernooi.</p>
            <button class="btn-yes" onclick="subscribeUser()">✅ Meldingen Aanzetten</button>
            <button class="btn-no" onclick="closePushModal()">Nee bedankt, ik let zelf wel op</button>
        </div>
    </div>

<script>
    let activeTournament = null;
    let refreshInterval = null;
    let currentFilter = 'alles';

    const urlParams = new URLSearchParams(window.location.search);
    const urlTournament = urlParams.get('t');

    async function loadTournaments() {
        try {
            const response = await fetch('/api/tournaments');
            const names = await response.json();
            const container = document.getElementById('menu-container');
            
            if(names.length === 0) {
                container.innerHTML = "<div class='no-matches'>Geen toernooien gevonden. Voeg ze toe via het tandwieltje rechtsboven.</div>";
                return;
            }

            container.innerHTML = names.map(name => `
                <div class="tournament-card" onclick="selectTournament('${name}')">
                    ${name.toUpperCase()}
                </div>
            `).join('');

            if (urlTournament && names.includes(urlTournament)) {
                selectTournament(urlTournament, false);
            }
        } catch (e) {
            document.getElementById('menu-container').innerHTML = "<div class='no-matches'>Kon niet verbinden met de server.</div>";
        }
    }

    function selectTournament(name, pushUrl = true) {
        activeTournament = name;
        
        if (pushUrl) {
            const url = new URL(window.location);
            url.searchParams.set('t', name);
            window.history.pushState({}, '', url);
        }

        document.getElementById('menu-container').style.display = 'none';
        document.getElementById('filter-container').style.display = 'flex';
        document.getElementById('matches-container').style.display = 'grid';
        document.getElementById('btn-back').style.display = 'block';
        document.getElementById('main-title').innerText = name.toUpperCase();
        
        loadMatches();
        refreshInterval = setInterval(loadMatches, 30000);
    }

    function showMenu() {
        activeTournament = null;
        clearInterval(refreshInterval);
        
        const url = new URL(window.location);
        url.searchParams.delete('t');
        window.history.pushState({}, '', url);

        document.getElementById('menu-container').style.display = 'grid';
        document.getElementById('filter-container').style.display = 'none';
        document.getElementById('matches-container').style.display = 'none';
        document.getElementById('btn-back').style.display = 'none';
        document.getElementById('main-title').innerText = "🎯 TOERNOOIEN";
    }

    function setFilter(status) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`filter-${status}`).classList.add('active');
        loadMatches();
    }

    async function loadMatches() {
        if (!activeTournament) return;
        try {
            const response = await fetch(`/api/matches?tournament=${encodeURIComponent(activeTournament)}`);
            const allMatches = await response.json();
            const container = document.getElementById('matches-container');
            
            let matches = allMatches;
            if (currentFilter !== 'alles') {
                matches = allMatches.filter(m => m.status === currentFilter);
            }

            if (matches.length === 0) { 
                container.innerHTML = `<div class='no-matches'>Geen wedstrijden gevonden voor dit filter.</div>`;
                return; 
            }

            let htmlString = "";
            let huidigeStatus = "";
            const titels = { "gepland": "⚡ Geplande Wedstrijden", "mogelijk": "🔮 Mogelijke Volgende Ronde", "gespeeld": "✅ Gespeelde Wedstrijden" };
            
            matches.forEach(match => {
                if (match.status !== huidigeStatus) {
                    huidigeStatus = match.status;
                    htmlString += `<div class="section-title">${titels[huidigeStatus]}</div>`;
                }

                let scoreText = (match.score1 !== "" || match.score2 !== "") ? `${match.score1} - ${match.score2}` : "vs";
                let headerText = match.status === "mogelijk" ? `MOGELIJK VOOR: ${match.mogelijkVoor.toUpperCase()}` : match.toernooi.toUpperCase();
                if (match.rol === "marker") { headerText += " ✍️ (SCHRIJVEN)"; }

                let resultClass = match.resultaat ? match.resultaat : "";
                let recapKnop = match.recapId ? `<a href="https://recap.dartconnect.com/matches/${match.recapId}" target="_blank" class="recap-btn">📊 RECAP</a>` : "";

                htmlString += `
                <div class="match-card ${match.status} ${resultClass}">
                    <div class="card-header">
                        <span>${headerText}</span>
                        <span class="board-badge">BORD ${match.board}</span>
                    </div>
                    <div class="card-subheader">
                        <span>Tijd: ${match.time} ${match.status === "mogelijk" ? '('+match.toernooi+')' : ''}</span>
                        <span>${match.ronde} | ID: <span class="match-id">${match.id || '?'}</span> ${recapKnop}</span>
                    </div>
                    <div class="players-area">
                        <div class="player-name">${match.player1}</div>
                        <div class="score-box">${scoreText}</div>
                        <div class="player-name">${match.player2}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = htmlString;
        } catch (error) { 
            document.getElementById('matches-container').innerHTML = "<div class='no-matches'>Fout bij laden van data.</div>";
        }
    }

    // --- PWA & SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
    }

    // --- PUSH MELDINGEN LOGICA ---
    const pushModal = document.getElementById('push-modal');

    async function initPush() {
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            const registration = await navigator.serviceWorker.ready;
            const subscription = await registration.pushManager.getSubscription();
            
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            
            if (isStandalone && !subscription && Notification.permission !== 'denied') {
                pushModal.style.display = 'flex';
            }
        }
    }

    function closePushModal() {
        pushModal.style.display = 'none';
    }

    async function subscribeUser() {
        try {
            const registration = await navigator.serviceWorker.ready;
            const response = await fetch('/api/vapidPublicKey');
            const vapidPublicKey = await response.text();
            
            const convertedVapidKey = urlBase64ToUint8Array(vapidPublicKey);
            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: convertedVapidKey
            });

            await fetch('/api/subscribe', {
                method: 'POST',
                body: JSON.stringify(subscription),
                headers: { 'Content-Type': 'application/json' }
            });

            closePushModal();
            alert("Meldingen staan aan! Je krijgt nu een trilsignaal als je moet spelen.");
        } catch (error) { 
            alert("Oeps! Het instellen van meldingen is mislukt. Misschien moet je ze aanzetten in je telefoon-instellingen.");
            closePushModal();
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
    }

    initPush();
    loadTournaments();
</script>
</body>
</html>
