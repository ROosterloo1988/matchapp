<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Match App</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6600">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f4; margin: 0; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; }
        
        /* TOP BAR & HEADERS */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-bar-side { width: 85px; }
        .top-bar-left { text-align: left; }
        .top-bar h1 { margin: 0; font-size: 1.5rem; text-align: center; flex: 1; color: #333; }
        .btn-back { background: #333; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; display: inline-block; }
        
        h2 { color: #333; margin-top: 30px; border-bottom: 2px solid #FF6600; padding-bottom: 5px; font-size: 1.2rem; }
        
        /* LIJSTEN & ITEMS */
        .item-list { margin-bottom: 15px; }
        .item { display: flex; justify-content: space-between; background: #eee; padding: 10px; margin-bottom: 5px; border-radius: 5px; align-items: center; gap: 10px; }
        .item span { flex: 1; word-break: break-all; font-size: 0.95rem; }
        
        .item-actions { display: flex; gap: 5px; flex-shrink: 0; }
        .item-actions button { color: white; border: none; padding: 10px; cursor: pointer; border-radius: 3px; font-weight: bold; font-size: 1rem; }
        .btn-delete { background: #e74c3c; }
        .btn-edit { background: #3498db; }
        
        /* FORMULIEREN & KNOPPEN */
        input, select, textarea { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif; font-size: 1rem; }
        .form-buttons { display: flex; gap: 10px; margin-top: 10px; }
        button.add-btn { background: #FF6600; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; border-radius: 4px; font-weight: bold; font-size: 1rem; }
        button.cancel-btn { background: #888; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; border-radius: 4px; font-weight: bold; font-size: 1rem; display: none; }
        button.save-btn { background: green; color: white; border: none; padding: 15px; cursor: pointer; width: 100%; font-size: 1.1rem; border-radius: 4px; margin-top: 30px; font-weight: bold; }
        
        /* PUSH MELDINGEN SECTIE */
        .push-section { background: #eee; padding: 15px; border-radius: 8px; }
        .push-section p { margin-top: 0; font-size: 0.9rem; color: #555; }
        #push-status { margin-top: 10px; font-weight: bold; text-align: center; }
        
        .tournament-box { background: #fff; padding: 15px; border-radius: 8px; border: 2px dashed #ccc; margin-bottom: 20px; }
        .bracket-group { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #ddd; }
        .bracket-group label { font-size: 0.9rem; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        .bracket-group input { margin-bottom: 5px; }
        .bracket-group input:last-child { margin-bottom: 0; }
        .status-box { background:#f9fafb; border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:10px; }
        .status-row { display:flex; justify-content:space-between; gap:10px; font-size:0.9rem; margin:4px 0; }
        .status-badge { padding:3px 8px; border-radius:999px; font-weight:bold; font-size:0.75rem; }
        .status-ok { background:#e8f7ec; color:#1e7e34; }
        .status-warn { background:#fff3cd; color:#856404; }
        .error-log { background:#111; color:#ddd; border-radius:8px; padding:10px; font-family:monospace; font-size:0.8rem; max-height:180px; overflow:auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="top-bar-side top-bar-left">
            <a href="/" class="btn-back">⬅ TERUG</a>
        </div>
        <h1>⚙️ Beheer</h1>
        <div class="top-bar-side"></div>
    </div>

    <h2>1. Toernooien (API Links)</h2>
    <div id="tournaments-list" class="item-list"></div>
    
    <div class="tournament-box">
        <input type="text" id="t-name" placeholder="Naam toernooi (bijv. Dutch Open Single)">
        
        <label style="display: block; margin-bottom: 15px; background: #fff3cd; padding: 10px; border-left: 4px solid #ffc107; border-radius: 4px; font-weight: bold; color: #555; cursor: pointer;">
            <input type="checkbox" id="t-unlisted" style="width: auto; margin-right: 10px; transform: scale(1.3);"> 🔒 Verborgen (User) Toernooi
        </label>

        <select id="t-format" onchange="updateTournamentFields()" style="font-weight: bold; margin-bottom: 15px; background: #fdfdfd;">
            <option value="1">👉 Enkel Schema (Alleen Knockout of Poule)</option>
            <option value="2">👉 Poules + Hoofdschema (2 Links)</option>
            <option value="3">👉 Poules + Winnaarsronde + Verliezersronde (3 Links)</option>
        </select>

        <div id="dynamic-fields"></div>

        <div class="form-buttons">
            <button id="btn-add-tournament" class="add-btn" onclick="addTournament()">Toevoegen</button>
            <button id="btn-cancel-edit" class="cancel-btn" onclick="cancelEdit()">Annuleren</button>
        </div>
    </div>

    <h2>2. Darters per Toernooi</h2>
    <select id="d-toernooi-select"></select>
    <div id="darters-list" class="item-list"></div>
    <select id="d-player-select">
        <option value="">Kies deelnemende speler...</option>
    </select>
    <button class="add-btn" onclick="addDarterFromList()">Toevoegen geselecteerde speler</button>
    

    <button class="save-btn" onclick="saveSettings()">💾 Alles Opslaan</button>

    <h2>3. 📢 App-Melding Versturen</h2>
    <div class="push-section">
        <p>Stuur een handmatig bericht naar alle telefoons die de meldingen aan hebben staan.</p>
        <input type="text" id="custom-push-title" placeholder="Titel (bijv: Klaar voor morgen?!)">
        <textarea id="custom-push-body" rows="3" placeholder="Bericht (bijv: Vergeet niet je pijlen te slijpen en op tijd te zijn...)"></textarea>
        <button class="add-btn" onclick="sendCustomPush()">🚀 Verstuur Melding Naar Iedereen</button>
        <div id="push-status"></div>
    </div>

    <h2>4. 📟 Systeemstatus</h2>
    <div class="push-section">
        <p>Live status van backend onderdelen en recente fouten.</p>
        <button class="add-btn" onclick="loadSystemStatus()">🔄 Vernieuw status</button>
        <div id="system-status" style="margin-top:10px;">Nog niet geladen.</div>
    </div>
</div>

<script>
    let db = { tournaments: [] };
    let editingTournamentIndex = null;

    function updateTournamentFields() {
        const format = parseInt(document.getElementById('t-format').value);
        const container = document.getElementById('dynamic-fields');
        let html = '';

        const labels = format === 1 ? ['Schema Link(s)'] :
                       format === 2 ? ['De Groepsfase', 'De Knockoutfase'] :
                       ['De Groepsfase', 'De Winnaarsronde', 'De Verliezersronde'];
                       
        labels.forEach((label, i) => {
            html += `
            <div class="bracket-group">
                <label>${label}</label>
                <input type="text" class="t-url-input" placeholder="Bracket URL (Verplicht)" data-index="${i}">
            </div>
            `;
        });
        container.innerHTML = html;
    }

    async function loadSettings() {
        try {
            const res = await fetch('/api/settings');
            db = await res.json();
            if (!db.tournaments) db.tournaments = [];
            db.tournaments.forEach(t => { if (!t.darters) t.darters = []; });
            renderTournaments();
            renderTournamentDropdown();
        } catch(e) {
            console.error("Kon instellingen niet laden", e);
        }
    }

    function renderTournaments() {
        const list = document.getElementById('tournaments-list');
        list.innerHTML = '';
        db.tournaments.forEach((t, i) => {
            let bCount = t.url ? t.url.split(',').length : 0;
            
            // Controleer of dit toernooi verborgen is
            let badge = t.unlisted ? '<span style="background: #e74c3c; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; margin-left: 10px; vertical-align: middle;">🔒 VERBORGEN</span>' : '';
            
            list.innerHTML += `<div class="item">
                <span><b>${t.name}</b> ${badge}<br><small style="color:#666;">🔗 ${bCount} Bracket(s) gekoppeld</small></span>
                <div class="item-actions">
                    <button class="btn-edit" onclick="editTournament(${i})">✏️</button>
                    <button class="btn-delete" onclick="removeTournament(${i})">X</button>
                </div>
            </div>`;
        });
        renderTournamentDropdown();
    }

    function editTournament(index) {
        const t = db.tournaments[index];
        document.getElementById('t-name').value = t.name;
        document.getElementById('t-unlisted').checked = !!t.unlisted;

        let urls = t.url ? t.url.split(',') : [];

        let format = urls.length <= 1 ? 1 : urls.length === 2 ? 2 : 3;
        document.getElementById('t-format').value = format;
        updateTournamentFields();

        let urlInputs = document.querySelectorAll('.t-url-input');

        urls.forEach((u, i) => { if(urlInputs[i]) urlInputs[i].value = u; });
        
        editingTournamentIndex = index;
        
        const addBtn = document.getElementById('btn-add-tournament');
        addBtn.innerText = "Toernooi Bijwerken";
        addBtn.style.backgroundColor = "#2ecc71";
        document.getElementById('btn-cancel-edit').style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingTournamentIndex = null;
        document.getElementById('t-name').value = '';
        document.getElementById('t-unlisted').checked = false;
        document.getElementById('t-format').value = '1';
        updateTournamentFields(); 
        
        const addBtn = document.getElementById('btn-add-tournament');
        addBtn.innerText = "Toevoegen";
        addBtn.style.backgroundColor = "#FF6600";
        document.getElementById('btn-cancel-edit').style.display = "none";
    }

    function addTournament() {
        const name = document.getElementById('t-name').value.trim();
        const isUnlisted = document.getElementById('t-unlisted').checked;
        
        let urlInputs = Array.from(document.querySelectorAll('.t-url-input')).map(i => i.value.trim());

        if (!name || urlInputs.some(url => url === "")) {
            return alert("Vul in ieder geval een toernooinaam in en de verplichte Bracket URL('s)!");
        }

        // Auto-vertaler
        let translatedUrls = urlInputs.map(u => {
            if (u.includes('/event/') && !u.includes('/api/event/')) {
                return u.replace('/event/', '/api/event/').replace('/brackets/', '/bracket/').replace('/groups/', '/bracket/');
            }
            return u;
        });

        // Bracket check (deze laten we staan!)
        let validBrackets = translatedUrls.every(u => u.toLowerCase().includes('api') && u.toLowerCase().includes('bracket'));
        if (!validBrackets) return alert("❌ Een van de Bracket URLs is ongeldig.\n\nKopieer de link direct uit DartConnect.");

        let finalUrl = translatedUrls.join(',');

        if (editingTournamentIndex !== null) {
            db.tournaments[editingTournamentIndex].name = name;
            db.tournaments[editingTournamentIndex].url = finalUrl;
            db.tournaments[editingTournamentIndex].matchlistUrl = ""; // Wordt nu genegeerd door auto-detect op server
            db.tournaments[editingTournamentIndex].unlisted = isUnlisted;
        } else {
            db.tournaments.push({ name, url: finalUrl, matchlistUrl: "", darters: [], unlisted: isUnlisted });
        }
        
        cancelEdit();
        renderTournaments();
        saveSettings(true);
    }
    
    async function removeTournament(index) {
        if(confirm("Weet je zeker dat je dit toernooi (en alle spelers daarin) wilt verwijderen?")) {
            if(editingTournamentIndex === index) cancelEdit();
            db.tournaments.splice(index, 1);
            renderTournaments();
            renderDarters();
            await saveSettings(true);
            alert('✅ Toernooi verwijderd en opgeslagen.');
        }
    }

    function renderTournamentDropdown() {
        const select = document.getElementById('d-toernooi-select');
        select.innerHTML = db.tournaments.map((t, i) => `<option value="${i}">${t.name}</option>`).join('');
        select.onchange = () => {
            renderDarters();
            loadTournamentPlayersForAdmin();
        };
        renderDarters();
        loadTournamentPlayersForAdmin();
    }

    async function loadTournamentPlayersForAdmin() {
        const tIndex = document.getElementById('d-toernooi-select').value;
        const playerSelect = document.getElementById('d-player-select');
        playerSelect.innerHTML = `<option value="">Spelers laden...</option>`;
        if (tIndex === "") return;

        const tournament = db.tournaments[tIndex];
        const firstUrl = (tournament?.url || "").split(',')[0]?.trim();
        if (!firstUrl) {
            playerSelect.innerHTML = `<option value="">Geen bracket-link gevonden</option>`;
            return;
        }

        try {
            const res = await fetch('/api/fetch-players-preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: firstUrl })
            });
            const allNames = await res.json();
            const singlePlayers = new Set();
            allNames.forEach(n => {
                if (n.includes(' & ')) n.split(' & ').forEach(p => singlePlayers.add(p.trim()));
                else singlePlayers.add(n.trim());
            });
            const selected = new Set((tournament.darters || []).map(d => d.toLowerCase()));
            const options = Array.from(singlePlayers)
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b))
                .map(p => `<option value="${p}" ${selected.has(p.toLowerCase()) ? 'disabled' : ''}>${p}${selected.has(p.toLowerCase()) ? ' (al toegevoegd)' : ''}</option>`)
                .join('');
            playerSelect.innerHTML = `<option value="">Kies deelnemende speler...</option>${options}`;
        } catch (e) {
            playerSelect.innerHTML = `<option value="">Kon spelers niet laden</option>`;
        }
    }

    function renderDarters() {
        const list = document.getElementById('darters-list');
        list.innerHTML = '';
        const tIndex = document.getElementById('d-toernooi-select').value;
        if (tIndex === "") return;
        const tournament = db.tournaments[tIndex];

        if (tournament && tournament.darters) {
            tournament.darters.forEach((d, i) => {
                list.innerHTML += `<div class="item">
                    <span><b>${d}</b></span>
                    <div class="item-actions">
                        <button class="btn-edit" onclick="editDarter(${tIndex}, ${i})">✏️</button>
                        <button class="btn-delete" onclick="removeDarter(${tIndex}, ${i})">X</button>
                    </div>
                </div>`;
            });
        }
    }

    function editDarter(tIndex, dIndex) {
        const huidigeNaam = db.tournaments[tIndex].darters[dIndex];
        const nieuweNaam = prompt("Wijzig de naam van de darter:", huidigeNaam);

        if (nieuweNaam && nieuweNaam.trim() !== "") {
            db.tournaments[tIndex].darters[dIndex] = nieuweNaam.trim();
            renderDarters();
            saveSettings(true);
        }
    }

    function addDarterFromList() {
        const tIndex = document.getElementById('d-toernooi-select').value;
        const playerSelect = document.getElementById('d-player-select');
        const name = playerSelect.value;
        if (tIndex === "" || !name) return;
        const current = db.tournaments[tIndex].darters || [];
        if (!current.some(d => d.toLowerCase() === name.toLowerCase())) {
            current.push(name);
            db.tournaments[tIndex].darters = current;
            renderDarters();
            loadTournamentPlayersForAdmin();
            saveSettings(true);
        }
    }

    
    function removeDarter(tIndex, dIndex) {
        db.tournaments[tIndex].darters.splice(dIndex, 1);
        renderDarters();
        saveSettings(true);
    }

    async function saveSettings(silent = false) {
        const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(db)
        });
        if (!res.ok) {
            alert(`❌ Opslaan mislukt (status ${res.status}). Ververs de pagina en probeer opnieuw.`);
            return false;
        }
        if (!silent) alert('Opgeslagen!');
        return true;
    }

    async function sendCustomPush() {
        const titleInput = document.getElementById('custom-push-title');
        const bodyInput = document.getElementById('custom-push-body');
        const statusDiv = document.getElementById('push-status');
        
        if (!bodyInput.value) return alert('Vul in ieder geval een bericht in!');
        statusDiv.innerText = "⏳ Bezig met versturen...";
        statusDiv.style.color = "#888";

        try {
            const res = await fetch('/api/admin/send-push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    title: titleInput.value, 
                    body: bodyInput.value 
                })
            });
            const data = await res.json();
            statusDiv.innerText = data.message || data.error;
            statusDiv.style.color = data.success ? "green" : "red";
            if (data.success) {
                titleInput.value = '';
                bodyInput.value = '';
            }
        } catch(e) {
            statusDiv.innerText = "❌ Fout bij verbinden met de server.";
            statusDiv.style.color = "red";
        }
    }

    function asText(value) {
        return value === null || value === undefined || value === '' ? '-' : String(value);
    }

    function statusBadge(type, label) {
        return `<span class="status-badge ${type}">${label}</span>`;
    }

    async function loadSystemStatus() {
        const box = document.getElementById('system-status');
        if (!box) return;
        box.innerHTML = 'Status laden...';

        try {
            const res = await fetch('/api/admin/system-status?_t=' + Date.now());
            if (!res.ok) throw new Error('Status endpoint niet bereikbaar');
            const data = await res.json();

            const pouleDegraded = data.poule?.lastErrorAt && (!data.poule?.lastSuccessAt || data.poule.lastErrorAt > data.poule.lastSuccessAt);
            const pushDegraded = data.push?.lastErrorAt && (!data.push?.lastSuccessAt || data.push.lastErrorAt > data.push.lastSuccessAt);
            const recentErrors = (data.recentErrors || []).map(e =>
                `[${asText(e.at)}] ${asText(e.scope)}: ${asText(e.message)}`
            ).join('<br>') || 'Geen recente fouten.';

            box.innerHTML = `
                <div class="status-box">
                    <div class="status-row"><b>Uptime</b><span>${asText(data.uptimeSeconds)}s</span></div>
                    <div class="status-row"><b>Server gestart</b><span>${asText(data.startedAt)}</span></div>
                </div>
                <div class="status-box">
                    <div class="status-row"><b>Poule API</b><span>${pouleDegraded ? statusBadge('status-warn', 'DEGRADED') : statusBadge('status-ok', 'OK')}</span></div>
                    <div class="status-row"><span>Laatste succes</span><span>${asText(data.poule?.lastSuccessAt)}</span></div>
                    <div class="status-row"><span>Laatste fout</span><span>${asText(data.poule?.lastErrorAt)}</span></div>
                    <div class="status-row"><span>Laatste foutmelding</span><span>${asText(data.poule?.lastErrorMessage)}</span></div>
                    <div class="status-row"><span>Stale responses</span><span>${asText(data.poule?.staleServedCount)}</span></div>
                    <div class="status-row"><span>Cache toernooien</span><span>${asText(data.poule?.cacheTournaments)}</span></div>
                </div>
                <div class="status-box">
                    <div class="status-row"><b>Matches API</b><span>${statusBadge('status-ok','INFO')}</span></div>
                    <div class="status-row"><span>Cache hits/misses</span><span>${asText(data.matches?.cacheHits)} / ${asText(data.matches?.cacheMisses)}</span></div>
                    <div class="status-row"><span>Laatste fetch</span><span>${asText(data.matches?.lastFetchAt)}</span></div>
                    <div class="status-row"><span>Laatste duur</span><span>${asText(data.matches?.lastDurationMs)}ms</span></div>
                    <div class="status-row"><span>Cache keys</span><span>${asText(data.matches?.cacheKeys)}</span></div>
                </div>
                <div class="status-box">
                    <div class="status-row"><b>Push</b><span>${pushDegraded ? statusBadge('status-warn', 'WAARSCHUWING') : statusBadge('status-ok', 'OK')}</span></div>
                    <div class="status-row"><span>Laatste succes</span><span>${asText(data.push?.lastSuccessAt)}</span></div>
                    <div class="status-row"><span>Laatste fout</span><span>${asText(data.push?.lastErrorAt)}</span></div>
                    <div class="status-row"><span>Laatste resultaat</span><span>${asText(data.push?.lastSuccessCount)} ok / ${asText(data.push?.lastFailureCount)} fail</span></div>
                </div>
                <div class="status-box">
                    <div style="font-weight:bold; margin-bottom:8px;">Recente fouten</div>
                    <div class="error-log">${recentErrors}</div>
                </div>
            `;
        } catch (e) {
            box.innerHTML = `<span style="color:red;">❌ ${e.message}</span>`;
        }
    }

    updateTournamentFields();
    loadSettings();
    loadSystemStatus();
</script>
</body>
</html>
